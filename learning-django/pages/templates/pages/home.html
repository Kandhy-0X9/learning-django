
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Interactive Django Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            text-align: center;
            padding: 60px 20px;
        }

        .card {
            background: white;
            max-width: 500px;
            margin: 0 auto;
            padding: 35px;
            border-radius: 12px;
        }

        h1 {
            color: #146c94;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 12px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            background: #146c94;
            color: white;
            padding: 12px 22px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #0b4f70;
        }

        .greeting {
            margin-top: 24px;
            color: #146c94;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Welcome!</h1>

        <p>Enter your name and let Django greet you.</p>

        <form method="post">
            {% csrf_token %}

            <input
                type="text"
                name="name"
                placeholder="Enter your name"
                required
            >

            <br>

            <button type="submit">Say hello</button>
        </form>

        {% if name %}
            <div class="greeting">
                <h2>Hello, {{ name }}!</h2>
                <p>Welcome to your interactive Django website.</p>
            </div>
        {% endif %}
    </div>
</body>
</html>
